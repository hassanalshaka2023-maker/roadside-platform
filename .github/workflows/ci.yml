# Runs on every push and pull request: types, lint, unit tests, integration
# tests against a real PostgreSQL, and a production build.
#
# Every value below is a throwaway placeholder for CI only - no real secret
# lives in this file. Real secrets belong in the hosting dashboard.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://ci:ci@localhost:5432/roadside?schema=public
  TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/roadside_test?schema=public
  SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
  OTP_HMAC_SECRET: ci-only-otp-hmac-secret-not-used-anywhere-else
  ID_HASH_SECRET: ci-only-id-hash-secret-not-used-anywhere-else-0
  FILE_ENCRYPTION_KEYS: "1:ERERERERERERERERERERERERERERERERERERERERERE"
  FILE_ENCRYPTION_ACTIVE_VERSION: "1"
  SEED_ADMIN_EMAIL: admin@ci.test
  SEED_ADMIN_PASSWORD: ci-admin-password
  SEED_DISPATCHER_EMAIL: dispatcher@ci.test
  SEED_DISPATCHER_PASSWORD: ci-dispatcher-password
  STORAGE_DRIVER: local
  UPLOADS_DIR: /tmp/roadside-uploads
  SMS_PROVIDER: console
  EMAIL_PROVIDER: console
  RATE_LIMIT_DRIVER: memory
  LOG_LEVEL: warn

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: roadside
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration

      - name: Build
        run: npx prisma migrate deploy && npm run build
        env:
          NODE_ENV: production
